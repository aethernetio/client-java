plugins {
    id 'java-library'
    id 'maven-publish'
    id 'aether-protocol' version '1.0.0'

}


def onvoidNativeClassifier() {
    def osName = System.getProperty("os.name").toLowerCase()
    def osArch = System.getProperty("os.arch").toLowerCase()
    if (osName.contains("linux")) {
        return (osArch.contains("aarch64") || osArch.contains("arm64")) ? "linux-aarch64" : "linux-x86_64"
    }
    if (osName.contains("mac") || osName.contains("darwin")) {
        return (osArch.contains("aarch64") || osArch.contains("arm64")) ? "macos-aarch64" : "macos-x86_64"
    }
    if (osName.contains("windows")) {
        return (osArch.contains("aarch64") || osArch.contains("arm64")) ? "windows-aarch64" : "windows-x86_64"
    }
    return null
}



dependencies {
    api "io.aether:client-server-work-api:+"
    api "io.aether:core:+"




    runtimeOnly "io.aether:net-virtual:+"
    runtimeOnly "io.aether.crypto:sodium:+"
    runtimeOnly "io.aether.crypto:hydrogen-fast:+"
    runtimeOnly "io.aether.crypto:p256-aes-gcm:+"

    testImplementation "io.aether.crypto:sodium:+"
    testImplementation "io.aether.crypto:hydrogen-fast:+"
    testImplementation "io.aether.crypto:p256-aes-gcm:+"




    implementation "dev.onvoid.webrtc:webrtc-java:0.20.0"
    def webrtcNativeClassifier = onvoidNativeClassifier()
    if (webrtcNativeClassifier != null) {
        runtimeOnly "dev.onvoid.webrtc:webrtc-java:0.20.0:${webrtcNativeClassifier}"
        testRuntimeOnly "dev.onvoid.webrtc:webrtc-java:0.20.0:${webrtcNativeClassifier}"
    }




    testImplementation "org.mockito:mockito-core:5.18.0"
    testImplementation "net.bytebuddy:byte-buddy:1.17.5"
    testImplementation "net.bytebuddy:byte-buddy-agent:1.17.5"


    implementation "com.fasterxml.jackson.core:jackson-databind:2.15.0"

}


publishing {
    publications {
        mavenPublication(MavenPublication) {
            from components.java
            groupId = "io.aether"
            artifactId = "cloud-client"
        }
    }

jar {
    from(rootProject.file('README.md')) {
        into 'META-INF'
    }
}


}