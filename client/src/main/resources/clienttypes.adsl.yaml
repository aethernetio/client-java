include:
  - common
types:
  CloudWeight:
    fields:
      sid: short
      weight: long
  ClientInfo:
    fields:
      uid: UUID
      cloud: Cloud
      weights: CloudWeight[]

  PeerIdentityCredentials:
    fields:
#      Подпись от сервера (publicKey+uid)
      sign: Sign
      publicKey: KeySignPublic
      privateKey: KeySignPrivate

  ClientStateForSave:
    fields:
      registrationUri: URI[]
      servers: ServerDescriptor[]
      clients: ClientInfo[]
      rootSigners: Key[]
      cryptoLib: CryptoLib
      pingDuration: long
      parentUid: UUID
      countServersForRegistration: int
      timeoutForConnectToRegistrationServer: long
      uid: UUID
      alias: UUID
      masterKey: Key

      peerIdentityCredentials: PeerIdentityCredentials?
