pluginManagement {
    repositories {
        gradlePluginPortal()
        mavenLocal()
        mavenCentral()
        maven {
            url = 'https://nexus.aethernet.io/maven/releases/'
        }
    }
}
plugins {
    id("org.gradle.toolchains.foojay-resolver-convention") version "1.0.0"
}
rootProject.name = 'smarthub'



if (Boolean.getBoolean('smarthub.localClient')
        || Boolean.getBoolean('smarthub.publicSmoke')) {
    includeBuild('..') {
        dependencySubstitution {
            substitute module('io.aether:cloud-client') using project(':client')
        }
    }
}
